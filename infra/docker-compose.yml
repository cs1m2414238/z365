services:
  postgres:
    image: postgres:18-alpine
    container_name: z365-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-z365_db}
      POSTGRES_USER: ${POSTGRES_USER:-z365_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-z365_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-z365_user} -d ${POSTGRES_DB:-z365_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

