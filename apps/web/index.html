<!doctype html>
<html lang="en" data-scroll-behavior="smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0c" />
    <meta
      name="description"
      content="Your learning, projects, and coding journey, together in Z365."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Coding Profile · Z365</title>
    <script>
      try {
        const saved = localStorage.getItem("z365.theme.v1");
        const theme = saved === "light" ? "light" : "focus";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme =
          theme === "light" ? "light" : "dark";
      } catch {
        document.documentElement.dataset.theme = "focus";
        document.documentElement.style.colorScheme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
