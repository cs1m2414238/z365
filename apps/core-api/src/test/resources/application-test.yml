spring:
  datasource:
    url: jdbc:h2:mem:z365_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=USER,VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        hbm2ddl:
          check_constraints: false
  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  agent-service:
    url: http://localhost:8000
  runner:
    url: http://localhost:8081
