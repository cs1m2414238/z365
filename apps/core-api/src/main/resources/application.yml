server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
    session:
      timeout: 30m
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  config:
    import: "optional:file:../../.env[.properties],optional:file:.env[.properties]"
  application:
    name: z365-core-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:${POSTGRES_PORT:5432}}/${DB_NAME:${POSTGRES_DB:z365_db}}
    username: ${DB_USER:${POSTGRES_USER:z365_user}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:z365_password}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# OpenAPI documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Downstream isolated services (monorepo, distributed runtime)
services:
  agent-service:
    url: ${AGENT_SERVICE_URL:http://localhost:8000}
    timeout-ms: 5000
  runner:
    url: ${RUNNER_SERVICE_URL:http://localhost:8081}
    timeout-ms: 10000

z365:
  web:
    origins: ${WEB_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
  integrations:
    github-token: ${GITHUB_API_TOKEN:}
    sync-enabled: ${PLATFORM_SYNC_ENABLED:true}

# Logging configuration
logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
  level:
    root: INFO
    com.z365.coreapi: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ${LOG_LEVEL_SQL:WARN}

