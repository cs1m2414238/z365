server:
  port: 8080

spring:
  application:
    name: z365-backend

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

# Downstream service communication endpoints
services:
  agent-service:
    url: ${AGENT_SERVICE_URL:http://localhost:8000}
  runner:
    url: ${RUNNER_SERVICE_URL:http://localhost:8081}
